<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engineering Modern Software That Scales</title>
  <style>
    :root {
      --primary: #1E3A8A;
      --accent: #06B6D4;
      --bg: #ffffff;
      --gray-light: #f3f4f6;
      --gray: #6b7280;
      --text: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    html {
      scroll-behavior: smooth;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Layout helpers */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    section {
      padding: 4rem 0;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e5e7eb;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
    }

    .nav-logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
    }

    .nav-links a {
      color: #4b5563;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-cta {
      margin-left: 1.5rem;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Hero */
    .hero {
      padding: 4.5rem 0 3.5rem;
      background: radial-gradient(circle at top left, #e0f2fe 0, #f9fafb 40%);
    }

    .hero-layout {
      display: grid;
      gap: 2.5rem;
    }

    @media (min-width: 768px) {
      .hero-layout {
        grid-template-columns: minmax(0, 2fr) minmax(0, 1.5fr);
        align-items: center;
      }
    }

    .hero-title {
      font-size: clamp(2rem, 3vw + 1rem, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .hero-subtitle {
      margin-top: 1rem;
      color: var(--gray);
      max-width: 32rem;
      font-size: 1rem;
    }

    .hero-actions {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn-primary {
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .btn-secondary {
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #111827;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .hero-illustration {
      border-radius: 1.5rem;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      padding: 1.5rem;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      font-size: 0.85rem;
    }

    .hero-illustration-title {
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .pill {
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: var(--gray-light);
      font-size: 0.75rem;
      color: #374151;
    }

    /* Section headings */
    .section-header {
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .section-subtitle {
      margin-top: 0.35rem;
      color: var(--gray);
      font-size: 0.95rem;
    }

    /* Services */
    .grid {
      display: grid;
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .card {
      background: #ffffff;
      border-radius: 1rem;
      border: 1px solid #e5e7eb;
      padding: 1rem;
      font-size: 0.9rem;
    }

    .card-title {
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      font-size: 0.75rem;
      margin-top: 0.75rem;
    }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: #eff6ff;
      color: #1e40af;
    }

    /* Process timeline */
    .timeline {
      display: grid;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .timeline {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .timeline-step {
      text-align: left;
    }

    .timeline-step-number {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .timeline-step-title {
      font-weight: 600;
      margin-top: 0.25rem;
      margin-bottom: 0.25rem;
    }

    /* Contact form */
    .form {
      display: grid;
      gap: 0.75rem;
      max-width: 600px;
    }

    @media (min-width: 640px) {
      .form-row-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 0.25rem;
    }

    input,
    textarea {
      width: 100%;
      padding: 0.5rem 0.6rem;
      border-radius: 0.5rem;
      border: 1px solid #d1d5db;
      font: inherit;
      font-size: 0.85rem;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .form-actions {
      margin-top: 0.75rem;
    }

    /* Footer */
    footer {
      border-top: 1px solid #e5e7eb;
      padding: 1.5rem 0;
      font-size: 0.8rem;
      color: #6b7280;
    }

    .footer-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-weight: 700;
      color: var(--primary);
    }

    .footer-links {
      display: flex;
      gap: 0.75rem;
    }

    @media (max-width: 640px) {
      .nav-links {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header>
    <div class="container nav" aria-label="Main">
      <div class="nav-logo">Company Logo</div>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="#home">Home</a>
        <a href="#services">Services</a>
